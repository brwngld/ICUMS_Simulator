<dialog id="gsa-product-dialog" class="code-dialog" aria-labelledby="gsa-product-title">
  <form method="dialog" class="code-dialog-card">
    <header><h2 id="gsa-product-title">Search Opt In/Out Product Group Item</h2><button type="submit" aria-label="Close GSA product popup">×</button></header>
    <p><strong>MDA:</strong> GSA, Ghana Standards Authority</p>
    <div class="code-search"><label>Product Group Name <input id="gsa-product-filter"></label><button id="filter-gsa-products" type="button">Search</button></div>
    <div class="cargo-table-wrap"><table><thead><tr><th>No.</th><th>Product Name</th><th>Product Fee</th><th>Currency</th><th>Remarks</th></tr></thead><tbody id="gsa-product-list"></tbody></table></div>
    <div class="code-pagination" id="gsa-product-pagination" aria-label="GSA product pages"></div>
    <p class="dialog-help">Select a row to fill the Product Group Item.</p>
  </form>
</dialog>
