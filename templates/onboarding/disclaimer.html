{% extends "core/base_student.html" %}

{% block title %}Simulator notice · ICUMS Simulator{% endblock %}

{% block content %}
  <div class="dash">
    <section class="dash-panel">
      <p class="dash-eyebrow">Required acknowledgement</p>
      <h1 id="notice-heading" style="margin: 0 0 .75rem; font-size: 1.3rem; font-weight: 700;">{{ disclaimer.title }}</h1>
      <div class="dash-copy" style="line-height: 1.6; font-size: .85rem;">{{ disclaimer.body|linebreaks }}</div>
      <form method="post" class="dash-form">
        {% csrf_token %}
        <label><input type="checkbox" name="accept" value="yes" required> I understand that this is a training simulator and not the official ICUMS system.</label>
        <button class="primary-button" type="submit">Accept and continue</button>
      </form>
    </section>
  </div>
{% endblock %}
