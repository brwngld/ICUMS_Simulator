# TLS-terminating reverse proxy for the temporary VPS deployment (audit SEC-04).
#
# Certbot issues the certificate and installs the renewal timer:
#   sudo certbot --nginx -d customsclearancepractice.com
# The referenced options-ssl-nginx.conf and ssl-dhparams.pem files are written
# by certbot alongside the certificates. Start Django with DJANGO_HTTPS=1 (and
# later DJANGO_HSTS=1) so the application settings agree with this file.

server {
    listen 80;
    server_name customsclearancepractice.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name customsclearancepractice.com;

    ssl_certificate /etc/letsencrypt/live/customsclearancepractice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customsclearancepractice.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
